name: test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - run: go mod tidy
      - run: go test ./...
      - name: Cross-compile
        run: |
          set -e
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/flowd ./cmd/flowd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/flowd-arm64 ./cmd/flowd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/flowd.exe ./cmd/flowd
