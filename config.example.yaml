# 复制为 config.yaml 后按需修改。容器部署时网页保存的配置写在数据卷里，一般不用手改这份文件。
listen: 127.0.0.1:8787
token: ""
victorialogs:
  url: http://127.0.0.1:9428
capture:
  ifaces: []
  idle_timeout: 30s
  export_interval: 15s
proc:
  enabled: true
  root: /proc
  interval: 2s
filter:
  include_domains: []
  exclude_domains: []
  include_apps: []
  exclude_apps: []
